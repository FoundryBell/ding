<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>DING — a bell, at night</title>
<!--
  DING v2. Preservation: one bell, one verb; bell partials synthesized in code;
  growth per ring; pop to small; swing physics; keyboard + pointer.
  Asset routing: no external assets. All art is inline SVG drawn in code,
  all sound is WebAudio synthesized in code.
-->
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:#070512}
  body{font-family:ui-rounded,system-ui,sans-serif;color:#f3e5bb;user-select:none;touch-action:manipulation}
  #scene{position:fixed;inset:0;width:100%;height:100%}
  #vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 42%,transparent 55%,rgba(2,0,10,.55) 100%)}
  #word{position:fixed;top:9vh;left:0;right:0;text-align:center;font-size:clamp(24px,5.5vw,42px);font-weight:600;letter-spacing:.01em;min-height:1.3em;color:#f3e5bb;text-shadow:0 2px 18px #000c;padding:0 16px;transition:opacity .45s}
  #count{position:fixed;bottom:5.5vh;left:0;right:0;text-align:center;font-size:14px;opacity:.5;font-weight:500;letter-spacing:.04em}
  #stage{position:fixed;inset:0;display:grid;place-items:center;padding-top:6vh}
  #bell{border:0;background:none;cursor:pointer;transform-origin:50% -30%;will-change:transform;filter:drop-shadow(0 16px 22px rgba(0,0,0,.65))}
  #bell:focus-visible{outline:3px solid #f3e5bb;outline-offset:12px;border-radius:50%}
  .mote{position:absolute;width:7px;height:7px;border-radius:50%;pointer-events:none;background:#ffd977}
  .ringwave{position:absolute;border:2px solid rgba(255,217,119,.4);border-radius:50%;pointer-events:none}
  .mist{animation:drift 26s ease-in-out infinite alternate}
  .mist2{animation:drift 38s ease-in-out infinite alternate-reverse}
  @keyframes drift{from{transform:translateX(-26px)}to{transform:translateX(26px)}}
  .tw{animation:tw 3.4s ease-in-out infinite}
  @keyframes tw{0%,100%{opacity:.25}50%{opacity:.95}}
  .fly{animation:fly 9s ease-in-out infinite}
  @keyframes fly{0%,100%{transform:translate(0,0)}33%{transform:translate(14px,-20px)}66%{transform:translate(-10px,-8px)}}
  @media (prefers-reduced-motion:reduce){.mist,.mist2,.tw,.fly{animation:none}}
</style>
</head>
<body>
<svg id="scene" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070512"/><stop offset=".55" stop-color="#141031"/><stop offset=".82" stop-color="#2a1c44"/><stop offset="1" stop-color="#3a2547"/>
    </linearGradient>
    <radialGradient id="halo" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#f7ead0" stop-opacity=".28"/><stop offset="1" stop-color="#f7ead0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moonglow" cx=".42" cy=".4" r=".8">
      <stop offset="0" stop-color="#fdf6dd"/><stop offset="1" stop-color="#e8d9ac"/>
    </radialGradient>
  </defs>
  <rect width="1000" height="1000" fill="url(#sky)"/>
  <g id="stars"></g>
  <circle id="haloC" cx="782" cy="178" r="150" fill="url(#halo)"/>
  <circle cx="782" cy="178" r="62" fill="url(#moonglow)"/>
  <circle cx="758" cy="158" r="10" fill="#d9c896" opacity=".5"/><circle cx="800" cy="196" r="7" fill="#d9c896" opacity=".45"/><circle cx="792" cy="150" r="5" fill="#d9c896" opacity=".4"/>
  <!-- far hills -->
  <path d="M0 700 Q180 620 380 682 T1000 660 V1000 H0 Z" fill="#1b1332"/>
  <path d="M0 770 Q240 700 520 758 T1000 742 V1000 H0 Z" fill="#120b24"/>
  <!-- a small house, far away, one window -->
  <g>
    <rect x="118" y="690" width="74" height="52" fill="#0d0819"/>
    <path d="M108 692 L155 660 L202 692 Z" fill="#0d0819"/>
    <rect id="win1" x="146" y="706" width="17" height="20" fill="#2c2340"/>
    <rect id="win2" x="124" y="706" width="12" height="16" fill="#0d0819"/>
  </g>
  <!-- bare tree -->
  <g stroke="#0a0616" stroke-width="9" stroke-linecap="round" fill="none">
    <path d="M902 780 C898 720 906 680 894 636"/>
    <path d="M897 690 C874 668 858 664 842 650"/><path d="M899 660 C920 640 934 636 948 620"/>
    <path d="M894 636 C888 616 878 606 866 596"/>
  </g>
  <!-- ground -->
  <path d="M0 800 Q500 772 1000 806 V1000 H0 Z" fill="#08040f"/>
  <g stroke="#1e1633" stroke-width="3" stroke-linecap="round">
    <path d="M120 856 l0 -14 M138 860 l6 -12 M700 880 l0 -13 M716 884 l-6 -11 M330 906 l0 -12 M840 850 l5 -11"/>
  </g>
  <!-- mist -->
  <g fill="#cbb8e8">
    <ellipse class="mist" cx="300" cy="792" rx="300" ry="20" opacity=".05"/>
    <ellipse class="mist2" cx="720" cy="838" rx="340" ry="24" opacity=".045"/>
    <ellipse class="mist" cx="500" cy="742" rx="240" ry="13" opacity=".035"/>
  </g>
  <g id="flies" fill="#ffe9a0">
    <circle class="fly" cx="238" cy="560" r="3" opacity=".7"/>
    <circle class="fly" cx="742" cy="606" r="2.4" opacity=".55" style="animation-delay:-3s"/>
    <circle class="fly" cx="660" cy="470" r="2" opacity=".45" style="animation-delay:-6s"/>
  </g>
</svg>
<div id="vignette"></div>
<div id="word">there is a bell</div>
<div id="stage">
  <button id="bell" aria-label="Ring the bell">
    <svg id="svg" width="220" height="226" viewBox="0 0 200 206" aria-hidden="true">
      <rect x="96" y="0" width="8" height="34" rx="4" fill="#8a6a34"/>
      <ellipse cx="100" cy="40" rx="14" ry="12" fill="#ffcf4d"/>
      <path id="body" d="M100 42 C66 42 56 80 56 110 C56 134 46 146 38 154 C36 156 38 160 42 160 L158 160 C162 160 164 156 162 154 C154 146 144 134 144 110 C144 80 134 42 100 42 Z" fill="#ffb81c" stroke="#7a4a00" stroke-width="5" stroke-linejoin="round"/>
      <path d="M68 84 C72 64 84 54 94 52" fill="none" stroke="#fff3b0" stroke-width="9" stroke-linecap="round" opacity=".8"/>
      <circle cx="100" cy="172" r="15" fill="#7a4a00"/>
      <g id="eyes">
        <circle cx="84" cy="112" r="5" fill="#3a2400"/>
        <circle cx="116" cy="112" r="5" fill="#3a2400"/>
      </g>
    </svg>
  </button>
</div>
<div id="count">night. no one around.</div>
<script>
const bell=document.getElementById('bell'),svg=document.getElementById('svg'),word=document.getElementById('word'),count=document.getElementById('count'),stage=document.getElementById('stage'),eyes=document.getElementById('eyes'),win1=document.getElementById('win1'),win2=document.getElementById('win2'),haloC=document.getElementById('haloC');
// stars, drawn once
const sg=document.getElementById('stars'); let sh='';
for(let i=0;i<110;i++){ const x=Math.random()*1000,y=Math.random()*560,r=(Math.random()*1.6+0.5).toFixed(1),d=(Math.random()*-6).toFixed(1); sh+='<circle class="tw" cx="'+x.toFixed(0)+'" cy="'+y.toFixed(0)+'" r="'+r+'" fill="#e9e2ff" style="animation-delay:'+d+'s"/>'; }
sg.innerHTML=sh;
let n=0,cycle=0,scale=1,swing=0,vel=0,ctx=null;
// The text is a place, not jokes. One line at a time, in order.
const lines=['ding','again','it was already awake','the rope remembers hands','ding','somewhere, a window','it is not calling anyone','the sound goes out','and does not come back','you are still here','it noticed','the hill heard it','ding','it has been rung by weather','by a bird, once','tonight, by you','lower now','the metal is warm','ding','nothing is being announced','just the sound, going','the rope is stretching'];
const small=['there it is','small again','it went somewhere small','ding, from far away'];
function audio(){ if(!ctx) ctx=new (window.AudioContext||window.webkitAudioContext)(); if(ctx.state==='suspended') ctx.resume(); return ctx; }
function ring(size){
  const ac=audio(),t=ac.currentTime,base=620/Math.pow(size,0.7);
  [[0.5,0.5,2.8],[1,0.9,2.2],[1.19,0.6,1.4],[1.5,0.35,0.9],[2,0.5,0.7],[2.74,0.25,0.4]].forEach(([m,g,d])=>{
    const o=ac.createOscillator(),gn=ac.createGain(); o.type='sine'; o.frequency.value=base*m;
    gn.gain.setValueAtTime(0,t); gn.gain.linearRampToValueAtTime(g*0.22,t+0.005); gn.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.connect(gn).connect(ac.destination); o.start(t); o.stop(t+d+0.1);
  });
}
function motes(x,y,big){
  for(let i=0;i<(big?20:8);i++){
    const s=document.createElement('div'); s.className='mote'; const a=Math.random()*6.28,d=50+Math.random()*(big?170:90);
    s.style.left=x+'px'; s.style.top=y+'px'; stage.appendChild(s);
    s.animate([{transform:'translate(0,0) scale(1)',opacity:.95},{transform:'translate('+Math.cos(a)*d+'px,'+(Math.sin(a)*d-26)+'px) scale(0)',opacity:0}],{duration:600+Math.random()*450,easing:'cubic-bezier(.2,.8,.3,1)'}).onfinish=()=>s.remove();
  }
  const w=document.createElement('div'); w.className='ringwave'; const sz=230*scale;
  w.style.width=w.style.height=sz+'px'; w.style.left=(stage.clientWidth/2-sz/2)+'px'; w.style.top=(stage.clientHeight/2-sz/2)+'px';
  stage.appendChild(w); w.animate([{transform:'scale(.6)',opacity:.8},{transform:'scale(1.8)',opacity:0}],{duration:700,easing:'ease-out'}).onfinish=()=>w.remove();
}
function say(t){ word.style.opacity=0; setTimeout(()=>{ word.textContent=t; word.style.opacity=1; },180); }
function blink(){ eyes.style.transformOrigin='100px 112px'; eyes.style.transform='scaleY(.08)'; setTimeout(()=>eyes.style.transform='',140); }
setInterval(()=>{ if(Math.random()<0.6) blink(); },3400);
function ding(){
  n++; scale*=1.07;
  if(scale>3.2){
    ring(0.35); cycle++;
    scale=0.45; svg.setAttribute('width',220*scale); svg.setAttribute('height',226*scale);
    say(small[Math.floor(Math.random()*small.length)]);
    count.textContent='rung '+n+' times tonight. then, small.';
    win2.setAttribute('fill','#ffca6a'); // second window, far away, someone else awake now
    const r=bell.getBoundingClientRect(); motes(r.left+r.width/2,r.top+r.height/2,true);
    vel+=22; blink(); return;
  }
  ring(scale); vel+=(Math.random()<0.5?-1:1)*(10+Math.random()*6); blink();
  say(lines[(n-1)%lines.length]);
  if(n===3) win1.setAttribute('fill','#ffca6a'); // a window lights, far away
  haloC.animate([{opacity:.6},{opacity:1},{opacity:.6}],{duration:1200,easing:'ease-out'});
  const r=bell.getBoundingClientRect(); motes(r.left+r.width/2,r.top+r.height/2,scale>2);
  count.textContent='rung '+n+(n===1?' time':' times')+' tonight.';
  svg.setAttribute('width',220*scale); svg.setAttribute('height',226*scale);
}
bell.addEventListener('pointerdown',ding);
addEventListener('keydown',e=>{ if(e.code==='Space'||e.code==='Enter'){ e.preventDefault(); ding(); }});
(function loop(){ vel+=-swing*0.08; vel*=0.92; swing+=vel*0.06; bell.style.transform='rotate('+swing+'deg)'; requestAnimationFrame(loop); })();
addEventListener('pointermove',e=>{ if(e.pointerType==='mouse') vel+=(e.movementX||0)*0.02; });
</script>
</body>
</html>
